client_id = "711f95cf5c59811344721d9bb89b2255"
name = "bundled-app"
handle = "bundled-app-1"
application_url = "https://presidential-mls-apparel-pitch.trycloudflare.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://presidential-mls-apparel-pitch.trycloudflare.com/auth/callback",
  "https://presidential-mls-apparel-pitch.trycloudflare.com/auth/shopify/callback",
  "https://presidential-mls-apparel-pitch.trycloudflare.com/api/auth/callback"
]

[pos]
